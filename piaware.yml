name: piaware
services:
  piaware:
    container_name: piaware
    image: dgadams/piaware:latest
    restart: unless-stopped
    init: true
    devices:
      - /dev/bus/usb
    environment:
      FEEDER_ID: "your-feeder-id"
      RECEIVER_LON: "-100.500"
      RECEIVER_LAT: "40.500"
      RECEIVER_SERIAL: "00001090"   #optional
      RECEIVER_GAIN: 60
      JSON_LOCATION_ACCURACY: 2

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      
