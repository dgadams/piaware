worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  server_tokens off;
  sendfile on;
  default_type application/octet-stream;

  types {
    application/javascript js;
    application/json       json;
    image/gif              gif;
    image/png              png;
    image/svg+xml          svg;
    image/x-icon           ico;
    text/css               css;
    text/html              html;
    text/plain             txt;
  }

  gzip_static always;
  gunzip on;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 512;

  server {
    listen 8080;
    listen [::]:8080;
    root /dump1090/public_html;

    location / { }

    location /data/ {
      alias /run/dump1090/;
      expires -1;                 # emits Cache-Control: no-cache
    }

    location = /status.json {
      alias /run/piaware/status.json;
      expires -1;
    }

    location ^~ /data-978 { return 404; }
  }
}

